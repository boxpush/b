<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最近登録された限定公開</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }

  #players-container {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
  }

  .player-wrapper {
    position: relative;
    width: 100%;
    max-width: 560px;       /* 最大幅 */
    padding-top: 0%;    /* 16:9比率 */
    touch-action: manipulation; /* タップのみ受け付け、スクロール干渉回避 */
    cursor: pointer;         /* タッチで操作可能なことを示す */
  }

  .player-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* タッチ時はラッパーが受け取る */
  }

  .player-wrapper.active iframe {
    pointer-events: auto;  /* 再生開始後はiframeがタッチを受け取れる */
  }
</style>
</head>
<body>

<h2>YouTubeプレイヤー一覧（レスポンシブ＋タッチ対応）</h2>
<div id="players-container"></div>

<script>
  // 1. YouTube IFrame API 読み込み
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var players = [];

  // 2. 動画IDテキストファイルを fetch
  fetch('id_title_unlisted.txt')
    .then(response => response.text())
    .then(text => {
      const videoIds = text
        .split(/\r?\n/)
        .map(line => line.split('\t')[0])
        .filter(id => id.trim() !== '');

      const container = document.getElementById('players-container');
      videoIds.forEach((id, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'player-wrapper';
        wrapper.id = 'player_' + index;
        container.appendChild(wrapper);

        // タッチで再生開始
        wrapper.addEventListener('click', () => {
          if (!wrapper.classList.contains('active')) {
            wrapper.classList.add('active');
            players[index].playVideo();
          }
        });
      });
      window.videoIds = videoIds;
      if (typeof onYouTubeIframeAPIReady === 'function') {
        onYouTubeIframeAPIReady();
      }
    })
    .catch(err => console.error('動画ID取得エラー:', err));

  // 3. IFrame API 準備完了時にプレイヤー生成
  function onYouTubeIframeAPIReady() {
    if (!window.videoIds) return;
    window.videoIds.forEach((id, index) => {
      players[index] = new YT.Player('player_' + index, {
        videoId: id,
        events: {
          'onReady': onPlayerReady
        },
        playerVars: {
          rel: 0,       // 関連動画非表示
          modestbranding: 1
        }
      });
    });
  }

  function onPlayerReady(event) {
    // 初期状態では再生せず、タッチで再生する
  }
</script>

</body>
</html>
