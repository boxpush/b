<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubeプレイヤー一覧（タイトル付き）</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }

  #players-container {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
  }

  .video-card {
    width: 100%;
    max-width: 560px;
    flex: 1 1 300px;
  }

  .player-wrapper {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9比率 */
    background: #000;
    touch-action: manipulation;
    cursor: pointer;
  }

  .player-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .player-wrapper.active iframe {
    pointer-events: auto;
  }

  .video-info {
    text-align: center;
    margin-top: 6px;
  }

  .video-title {
    font-weight: bold;
    font-size: 1rem;
  }

  .video-date {
    font-size: 0.85rem;
    color: #666;
  }
</style>
</head>
<body>

<h2>限定公開</h2>
<div id="players-container"></div>

<script>
  // YouTube IFrame API読み込み
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var players = [];

  // 動画データ読み込み
  fetch('id_title_unlisted.txt')
    .then(response => response.text())
    .then(text => {
      const videoData = text.split(/\r?\n/).map(line => {
        const parts = line.split('\t');
        return {
          id: parts[0]?.trim() || '',
          date: parts[1]?.trim() || '',
          title: parts[2]?.trim() || ''
        };
      }).filter(item => item.id !== '');

      const container = document.getElementById('players-container');

      videoData.forEach((data, index) => {
        // カード要素
        const card = document.createElement('div');
        card.className = 'video-card';

        // プレイヤーラッパー
        const wrapper = document.createElement('div');
        wrapper.className = 'player-wrapper';
        wrapper.id = 'player_' + index;

        // 情報表示
        const infoDiv = document.createElement('div');
        infoDiv.className = 'video-info';
        infoDiv.innerHTML = `
          <div class="video-title">${data.title}</div>
          <div class="video-date">${data.date}</div>
        `;

        card.appendChild(wrapper);
        card.appendChild(infoDiv);
        container.appendChild(card);

        // タッチで再生開始
        wrapper.addEventListener('click', () => {
          if (!wrapper.classList.contains('active')) {
            wrapper.classList.add('active');
            players[index].playVideo();
          }
        });
      });

      window.videoData = videoData;
      if (typeof onYouTubeIframeAPIReady === 'function') {
        onYouTubeIframeAPIReady();
      }
    })
    .catch(err => console.error('動画ID取得エラー:', err));

  function onYouTubeIframeAPIReady() {
    if (!window.videoData) return;
    window.videoData.forEach((data, index) => {
      players[index] = new YT.Player('player_' + index, {
        videoId: data.id,
        events: { 'onReady': onPlayerReady },
        playerVars: {
          rel: 0,
          modestbranding: 1
        }
      });
    });
  }

  function onPlayerReady(event) {
    // 初期は再生しない
  }
</script>

</body>
</html>
