<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubeプレイヤー一覧（タイトル付き）</title>
<style>
  body {
    font-family: sans-serif;
    margin: 20px;
  }

  #players-container {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .player-wrapper {
    position: relative;
    width: 100%;
    max-width: 560px;       /* 最大幅 */
    padding-top: 6.25%;    /* 16:9比率 */
    touch-action: manipulation; 
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }

  .player-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* タッチはラッパーが受け取る */
  }

  .player-wrapper.active iframe {
    pointer-events: auto;
  }

  .video-info {
    position: relative;
    margin-top: calc(56.25% + 8px); /* iframeの下に余白 */
    width: 100%;
    text-align: center;
  }

  .video-title {
    font-weight: bold;
    font-size: 1rem;
    margin: 4px 0;
  }

  .video-date {
    font-size: 0.85rem;
    color: #666;
  }

  @media (max-width: 600px) {
    .player-wrapper {
      padding-top: 50%;
    }
    .video-info {
      margin-top: calc(50% + 6px);
    }
  }
</style>
</head>
<body>

<h2>YouTubeプレイヤー一覧（タイトル付き）</h2>
<div id="players-container"></div>

<script>
  // 1. YouTube IFrame API 読み込み
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var players = [];

  // 2. 動画IDテキストファイルを fetch
  fetch('video_ids.txt')
    .then(response => response.text())
    .then(text => {
      // タブ区切りで動画ID, 日時, タイトルを取得
      const videoData = text.split(/\r?\n/).map(line => {
        const parts = line.split('\t');
        return {
          id: parts[0]?.trim() || '',
          date: parts[1]?.trim() || '',
          title: parts[2]?.trim() || ''
        };
      }).filter(item => item.id !== '');

      const container = document.getElementById('players-container');

      videoData.forEach((data, index) => {
        // プレイヤーラッパー
        const wrapper = document.createElement('div');
        wrapper.className = 'player-wrapper';
        wrapper.id = 'player_' + index;

        // タイトル・日時表示
        const infoDiv = document.createElement('div');
        infoDiv.className = 'video-info';
        infoDiv.innerHTML = `<div class="video-title">${data.title}</div>
                             <div class="video-date">${data.date}</div>`;

        wrapper.appendChild(infoDiv);
        container.appendChild(wrapper);

        // タッチで再生開始
        wrapper.addEventListener('click', () => {
          if (!wrapper.classList.contains('active')) {
            wrapper.classList.add('active');
            players[index].playVideo();
          }
        });
      });

      window.videoData = videoData;
      if (typeof onYouTubeIframeAPIReady === 'function') {
        onYouTubeIframeAPIReady();
      }
    })
    .catch(err => console.error('動画ID取得エラー:', err));

  // 3. IFrame API準備完了でプレイヤー生成
  function onYouTubeIframeAPIReady() {
    if (!window.videoData) return;
    window.videoData.forEach((data, index) => {
      players[index] = new YT.Player('player_' + index, {
        videoId: data.id,
        events: { 'onReady': onPlayerReady },
        playerVars: {
          rel: 0,
          modestbranding: 1
        }
      });
    });
  }

  function onPlayerReady(event) {
    // 初期状態では再生せず、タッチで再生
  }
</script>

</body>
</html>
