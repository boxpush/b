<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>動画検索</title>
  <style>
    table { border-collapse: collapse; width: 100%; table-layout: auto; }
    th, td { border: 1px solid #ccc; padding: 4px; }
    th { background: #eee; }
    td:first-child, th:first-child { white-space: nowrap; width: 1%; }
    nav { margin: 10px 0; text-align: center; }
    button { margin: 0 5px; }
    #searchForm { text-align: center; margin: 10px 0; }
    #searchForm input[type="text"] { width: 300px; padding: 5px; }
  </style>
</head>
<body>
  <h1>動画検索</h1>
  <div>google検索嫌いな人向け.検索ワードに一致する結果しか出ません.１日１回更新</div>
  <div id="searchForm">
    <input type="text" id="searchInput" placeholder="日時・タイトルを正規表現で検索" value="ゲーム実況" />
    <button id="searchBtn">検索</button>
    <button id="clearBtn">クリア</button>
  </div>

  <nav id="paginationTop" style="display:none;">
    <button id="firstBtnTop" disabled>最初へ</button>
    <button id="prevBtnTop" disabled>前へ</button>
    <span id="pageInfoTop"></span>
    <input type="number" id="pageInputTop" min="1" style="width: 50px; text-align: right;" />
    <button id="jumpBtnTop">ジャンプ</button>
    <button id="nextBtnTop" disabled>次へ</button>
    <button id="lastBtnTop" disabled>最後へ</button>
  </nav>

  <div id="loading">読み込み中...</div>
  <table id="videoTable" style="display:none;">
    <thead>
      <tr>
        <th>日時</th>
        <th>タイトル</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <nav id="paginationBottom" style="display:none;">
    <button id="firstBtnBottom" disabled>最初へ</button>
    <button id="prevBtnBottom" disabled>前へ</button>
    <span id="pageInfoBottom"></span>
    <input type="number" id="pageInputBottom" min="1" style="width: 50px; text-align: right;" />
    <button id="jumpBtnBottom">ジャンプ</button>
    <button id="nextBtnBottom" disabled>次へ</button>
    <button id="lastBtnBottom" disabled>最後へ</button>
  </nav>
<script>
  const PAGE_SIZE = 100;
  
  let videos = [];
  let filteredVideos = [];
  let currentPage = 1;
  let totalPages = 1;
  
  function renderPage(page) {
    const tbody = document.querySelector('#videoTable tbody');
    tbody.innerHTML = '';
    const data = (filteredVideos !== null) ? filteredVideos : videos;
    totalPages = Math.ceil(data.length / PAGE_SIZE);
    if(totalPages === 0) totalPages = 1;
    if(page < 1) page = 1;
    if(page > totalPages) page = totalPages;
    currentPage = page;
  
    const start = (page - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, data.length);
    for (let i = start; i < end; i++) {
      const [videoId, date, title] = data[i];
      const tr = document.createElement('tr');
  
      const dateTd = document.createElement('td');
      dateTd.textContent = date;
      tr.appendChild(dateTd);
  
      const titleTd = document.createElement('td');
      const a = document.createElement('a');
      a.href = `https://www.youtube.com/watch?v=${videoId}`;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = title;
      titleTd.appendChild(a);
      tr.appendChild(titleTd);
  
      tbody.appendChild(tr);
    }
  
    ['Top', 'Bottom'].forEach(pos => {
      document.getElementById(`pageInfo${pos}`).textContent = `${currentPage} / ${totalPages}`;
      document.getElementById(`pageInput${pos}`).value = currentPage; // フォームの値を更新
      document.getElementById(`prevBtn${pos}`).disabled = currentPage === 1;
      document.getElementById(`nextBtn${pos}`).disabled = currentPage === totalPages;
      document.getElementById(`firstBtn${pos}`).disabled = currentPage === 1;
      document.getElementById(`lastBtn${pos}`).disabled = currentPage === totalPages;
    });
  }
  
  async function loadData(query = '') {
    document.getElementById('loading').textContent = "読み込み中..."
    document.getElementById('loading').style.display = 'block';
    const tbody = document.querySelector('#videoTable tbody');
    tbody.innerHTML = '';


    try {
      const url = `https://boxpush.d4df816be9225fab.workers.dev/all?q=${encodeURIComponent(query)}`;
      const res = await fetch(url, {
      method: "GET",
        headers: {
          "Content-Type": "application/json"
        }
      });
      if (!res.ok) throw new Error('取得に失敗しました');
      const text = await res.text();
      videos = text.trim() ? text.split('\n').map(line => line.split('\t')) : [];
      filteredVideos = null;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('videoTable').style.display = '';
      document.getElementById('paginationTop').style.display = '';
      document.getElementById('paginationBottom').style.display = '';
      renderPage(1);
    } catch (e) {
      document.getElementById('loading').textContent = e.message;
    }
  }
  
  function goPage(newPage) {
    let pageNum = parseInt(newPage, 10);
    // 入力値が数値でない場合は1に設定
    if (isNaN(pageNum)) {
        pageNum = 1;
    }
    // 1より小さい場合は1に補正
    if (pageNum < 1) {
        pageNum = 1;
    }
    // 総ページ数より大きい場合は総ページ数に補正
    if (pageNum > totalPages) {
        pageNum = totalPages;
    }
    renderPage(pageNum);
  }
  
  function applyFilter() {
    const pattern = document.getElementById('searchInput').value.trim();
    loadData(pattern); // Workers に検索ワードを渡して取得
  }
  
  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('searchBtn').click();
    }
  });
  document.getElementById('searchBtn').addEventListener('click', applyFilter);
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    loadData(''); // 検索解除で全件取得
  });
  
  ['Top', 'Bottom'].forEach(pos => {
    document.getElementById(`prevBtn${pos}`).addEventListener('click', () => goPage(currentPage - 1));
    document.getElementById(`nextBtn${pos}`).addEventListener('click', () => goPage(currentPage + 1));
    document.getElementById(`firstBtn${pos}`).addEventListener('click', () => goPage(1));
    document.getElementById(`lastBtn${pos}`).addEventListener('click', () => goPage(totalPages));

    // ジャンプ機能のイベントリスナー
    const jumpBtn = document.getElementById(`jumpBtn${pos}`);
    const pageInput = document.getElementById(`pageInput${pos}`);

    jumpBtn.addEventListener('click', () => {
      goPage(pageInput.value);
    });
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        goPage(pageInput.value);
      }
    });
  });

  // ページ読み込み時に初期ワードで検索
  applyFilter();
</script>
</body>
</html>
