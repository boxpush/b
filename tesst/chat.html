<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログ検索</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; margin-bottom: 2rem; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    th { background: #f0f0f0; }
    h1 { font-size: 1.2rem; margin-top: 2rem; }
    .cutoff { color: red; font-weight: bold; margin-bottom: 2rem; }
    .checkboxes { margin-bottom: 1rem; }
    label { margin-right: 1rem; }
  </style>
</head>
<body>
  <h1>ログ検索</h1>

  <div class="checkboxes" id="checkboxes"></div>
  <button id="searchBtn">検索</button>

  <div id="results"></div>

  <script>
    const checkboxes = ["小林","佐藤"];  // ここで定義

    const checkboxContainer = document.getElementById('checkboxes');
    const results = document.getElementById('results');

    // チェックボックスを動的生成
    checkboxes.forEach(word => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = "checkbox";
      input.value = word;
      label.appendChild(input);
      label.appendChild(document.createTextNode(word));
      checkboxContainer.appendChild(label);
    });

    document.getElementById('searchBtn').addEventListener('click', async () => {
      results.innerHTML = "";

      // 選択された値を集める
      const selected = [...checkboxContainer.querySelectorAll("input:checked")].map(el => el.value);
      if (selected.length === 0) {
        results.textContent = "検索語を選んでください";
        return;
      }

      // カンマ区切りで keywords を作成
      const keywords = encodeURIComponent(selected.join(","));
      const url = `https://boxpush.d4df816be9225fab.workers.dev/chat?keywords=${keywords}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP エラー: ${response.status}`);
        const data = await response.json();
        renderResults(data);
      } catch (err) {
        results.textContent = `エラー: ${err.message}`;
      }
    });

    function renderResults(data) {
      const MAX_ROWS = 1000;
      let rowCount = 0;
      if (Object.keys(data).length === 0) {
        results.textContent = "検索結果は０件です";
        return;
      }
      for (const [videoId, messages] of Object.entries(data)) {
        const h1 = document.createElement('h1');
        h1.textContent = videoId;
        results.appendChild(h1);

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        thead.innerHTML = "<tr><th>日時</th><th>メッセージ</th></tr>";
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        for (const line of messages) {
          if (rowCount >= MAX_ROWS) break;
          const [datetime, message] = line.split("\t");
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${datetime}</td><td>${message}</td>`;
          tbody.appendChild(tr);
          rowCount++;
        }

        table.appendChild(tbody);
        results.appendChild(table);

        if (rowCount >= MAX_ROWS) {
          const cutoffMsg = document.createElement('div');
          cutoffMsg.className = 'cutoff';
          cutoffMsg.textContent = `表示は ${MAX_ROWS} 行で打ち切りました。`;
          results.appendChild(cutoffMsg);
          break;
        }
      }
    }
  </script>
</body>
</html>
