<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログ検索フォーム</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; margin-bottom: 2rem; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
    th { background: #f0f0f0; }
    h1 { font-size: 1.2rem; margin-top: 2rem; }
    .cutoff { color: red; font-weight: bold; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <h1>ログ検索フォーム</h1>
  <form id="searchForm">
    <input type="text" id="keywords" placeholder="キーワードをカンマ区切りで入力" size="50">
    <button type="submit">検索</button>
  </form>

  <div id="results"></div>

  <script>
    const form = document.getElementById('searchForm');
    const results = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      results.innerHTML = ""; // 結果をクリア

      const keywords = encodeURIComponent(document.getElementById('keywords').value.trim());
      if (!keywords) {
        results.textContent = "キーワードを入力してください";
        return;
      }

      const url = `https://test.workers.dev/chat?keywords=${keywords}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP エラー: ${response.status}`);

        const data = await response.json();
        renderResults(data);

      } catch (err) {
        results.textContent = `エラー: ${err.message}`;
      }
    });

    function renderResults(data) {
      const MAX_ROWS = 1000;
      let rowCount = 0;

      for (const [videoId, messages] of Object.entries(data)) {
        // 動画IDを見出しに
        const h1 = document.createElement('h1');
        h1.textContent = videoId;
        results.appendChild(h1);

        // テーブルを作成
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        thead.innerHTML = "<tr><th>日時</th><th>メッセージ</th></tr>";
        table.appendChild(thead);

        const tbody = document.createElement('tbody');

        for (const line of messages) {
          if (rowCount >= MAX_ROWS) break;

          const [datetime, message] = line.split("\t");
          const tr = document.createElement('tr');
          const td1 = document.createElement('td');
          const td2 = document.createElement('td');

          td1.textContent = datetime;
          td2.textContent = message;

          tr.appendChild(td1);
          tr.appendChild(td2);
          tbody.appendChild(tr);

          rowCount++;
        }

        table.appendChild(tbody);
        results.appendChild(table);

        if (rowCount >= MAX_ROWS) {
          const cutoffMsg = document.createElement('div');
          cutoffMsg.className = 'cutoff';
          cutoffMsg.textContent = `表示は ${MAX_ROWS} 行で打ち切りました。`;
          results.appendChild(cutoffMsg);
          break;
        }
      }
    }
  </script>
</body>
</html>
