---
layout: default
---

<div style="text-align:center; position:relative; display:inline-block;">
  <a id="imageLink" href="" target="_blank" rel="noopener noreferrer"
     style="display: inline-block; position: relative;">
    <img id="viewer" alt="画像" style="max-height:80vh; display:block;">
    <div id="loading" style="
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255,255,255,0.7);
    ">
      <img src="https://i.gifer.com/YCZH.gif" alt="Loading" style="max-height:80vh;">
    </div>
    <div id="max-viewers" style="
      position: absolute;
      top: 0;
      right: 0;
      color: black;
      padding: 4px 8px;
      font-size: 14px;
      border-radius: 4px;
      pointer-events: none;
    ">--:--&#9;-----</div>
  </a>
</div>

<div style="text-align:center;">
  <button onclick="location.href='https://boxpush.github.io/a/';">名前なし版</button>
  <button id="prev">←</button>
  <input type="text" id="dateInput" placeholder="yyyymmdd" style="font-size:1.2rem; width:120px; text-align:center;">
  <button id="next">→</button>
  <button id="autoReloadBtn">自動更新(5分毎): OFF</button>
  <span id="countdown"></span>
</div>

<script>
  const repo = "b";
  const startDate = new Date(2025, 7, 8); // 0-basedで8月
  const today = new Date(new Date().getTime() - 10 * 60 * 1000);
  let offset = Math.floor((today - startDate) / (1000*60*60*24));

  let autoReload = false;
  let countdownSeconds = 300;
  let countdownIntervalId = null;

  const viewer = document.getElementById('viewer');
  const loading = document.getElementById('loading');
  const btn = document.getElementById('autoReloadBtn');
  const countdownElem = document.getElementById('countdown');

  btn.classList.toggle('active', autoReload);
  btn.classList.toggle('inactive', !autoReload);
  btn.setAttribute('aria-pressed', String(autoReload));

  btn.addEventListener('click', () => {
    autoReload = !autoReload;
    if (autoReload) {
      btn.textContent = '自動更新(5分毎): ON';
      btn.classList.add('active'); btn.classList.remove('inactive');
      btn.setAttribute('aria-pressed', 'true');
      countdownSeconds = 300;
      countdownElem.textContent = `${countdownSeconds}`;
      countdownIntervalId = setInterval(() => {
        countdownSeconds--;
        if (countdownSeconds <= 0) {
          countdownSeconds = 300;
          showImage();
        }
        countdownElem.textContent = `${countdownSeconds}`;
      }, 1000);
    } else {
      btn.textContent = '自動更新(5分毎): OFF';
      btn.classList.remove('active'); btn.classList.add('inactive');
      btn.setAttribute('aria-pressed', 'false');
      clearInterval(countdownIntervalId);
      countdownIntervalId = null;
      countdownElem.textContent = '';
    }
  });

  function getDateString(daysFromStart) {
    const d = new Date(startDate);
    d.setDate(d.getDate() + daysFromStart);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}${m}${day}`;
  }

  function showImage() {
    if (autoReload) { // ボタン押下やフォーム入力で自動更新をオフ
      autoReload = false;
      btn.textContent = '自動更新(5分毎): OFF';
      btn.classList.remove('active'); btn.classList.add('inactive');
      btn.setAttribute('aria-pressed', 'false');
      clearInterval(countdownIntervalId);
      countdownIntervalId = null;
      countdownElem.textContent = '';
    }

    loading.style.display = 'flex';
    viewer.style.display = 'none';

    const base = "https://f005.backblazeb2.com/file/boxpush/";
    const imgSrc = base + getDateString(offset) + repo + ".png";
    const txtSrc = "https://raw.githubusercontent.com/boxpush/" + repo + "/main/txt/" + getDateString(offset) + ".txt";

    viewer.onload = () => {
      loading.style.display = 'none';
      viewer.style.display = 'block';
    };
    viewer.src = imgSrc + '?t=' + new Date().getTime();
    document.getElementById('imageLink').href = imgSrc;

    const d = new Date(startDate);
    d.setDate(d.getDate() + offset);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    document.getElementById('dateInput').value = `${y}${m}${day}`;

    fetch(txtSrc + '?t=' + new Date().getTime())
      .then(r => r.ok ? r.text() : '')
      .then(text => document.getElementById('max-viewers').textContent = text)
      .catch(() => document.getElementById('max-viewers').textContent = '');
  }

  document.getElementById('prev').onclick = () => { offset = Math.max(0, offset - 1); showImage(); };
  document.getElementById('next').onclick = () => { offset = Math.min(Math.floor((today - startDate)/(1000*60*60*24)), offset + 1); showImage(); };

  document.getElementById('dateInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const val = this.value.trim();
      if (/^\d{8}$/.test(val)) {
        const y = parseInt(val.slice(0,4),10);
        const m = parseInt(val.slice(4,6),10);
        const d = parseInt(val.slice(6,8),10);
        const inputDate = new Date(y, m-1, d);
        if (inputDate >= startDate && inputDate <= today) {
          offset = Math.floor((inputDate - startDate)/(1000*60*60*24));
          showImage();
        }
      }
    }
  });

  showImage();
</script>
